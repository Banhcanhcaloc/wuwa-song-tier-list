<!DOCTYPE html>

<head>

  <meta name="description" content="Tạo và chia sẻ tier list nhạc Wuthering Waves. Xếp hạng, tìm kiếm, thêm bài hát và sao lưu dữ liệu.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b0e14;--surface:#121722;--surface2:#1a2130;--border:#263147;--text:#e8eef5;--muted:#8e9cb2;--gold:#e8c565;--green:#1db954;--red:#ef4444}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding-bottom:110px;background:radial-gradient(ellipse at 50% -20%,#202c42 0,transparent 55%),var(--bg);color:var(--text);font:15px 'Plus Jakarta Sans',sans-serif}button,input,select,textarea{font:inherit}button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;cursor:pointer;transition:.15s}button:hover{border-color:var(--gold);transform:translateY(-1px)}button.primary{background:var(--gold);color:#0b0e14;border-color:var(--gold);font-weight:800}button.green{color:#4ade80;border-color:var(--green);background:#1db95422}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px max(18px,calc((100vw - 1300px)/2));background:#121722ed;border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}h1{font:800 1rem Cinzel,serif;color:var(--gold);margin:0}.subtitle{font-size:.75rem;color:var(--muted);margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:.8rem}.wrap{max-width:1300px;margin:22px auto;padding:0 16px}.hero{padding:18px 20px;margin-bottom:16px;border:1px solid #e8c56575;border-radius:14px;background:linear-gradient(130deg,#1d2638,#111722);display:none;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.hero.show{display:flex}.spot{display:flex;align-items:center;gap:14px}.spot img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:2px solid var(--gold)}.spot small{color:var(--gold);font-weight:800}.spot h2{margin:4px 0;font-size:1.1rem}.spot p{margin:0;color:var(--muted);font-size:.82rem}.board{overflow:hidden;border:1px solid var(--border);border-radius:13px;background:#0e121b;box-shadow:0 15px 40px #0008}.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 18px;background:var(--surface);border-bottom:1px solid var(--border)}.board-title{font:800 1.05rem Cinzel,serif;color:var(--gold);outline:none}.hint{font-size:.75rem;color:var(--muted)}.tier{display:flex;min-height:92px;border-bottom:1px solid var(--border);background:#101520}.tier:last-child{border:0}.tier.over{background:#202b40}.tier-label{width:120px;min-width:120px;display:grid;place-items:center;padding:24px 8px 8px;position:relative;text-align:center;color:#0b0e14;font-weight:800;word-break:break-word}.tier-label [contenteditable]{outline:none}.tier-controls{position:absolute;right:4px;top:3px;display:flex;gap:3px}.tier-controls button{padding:2px 6px;background:#0009;border:0;color:white;font-size:.7rem}.items{flex:1;min-height:90px;padding:8px;display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:8px}.pool{margin-top:18px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:220px}.field{width:100%;padding:10px 12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}.chip{padding:6px 11px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:99px;cursor:pointer;font-size:.78rem}.chip.active{background:var(--gold);color:#0b0e14;border-color:var(--gold);font-weight:800}.pool-items{min-height:130px;padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;border:1px dashed var(--border);border-radius:10px;background:#0c1018}.card{width:min(290px,100%);display:flex;align-items:center;gap:9px;padding:7px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;cursor:grab}.card:hover{border-color:var(--gold)}.card.selected{outline:2px solid var(--gold)}.card.playing{border-color:var(--green)}.card img{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#080a0f;flex:none}.card-info{min-width:0;flex:1}.card-title,.card-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-title{font-size:.8rem;font-weight:700}.card-meta{font-size:.7rem;color:var(--muted);margin-top:3px}.card-actions{display:flex;gap:3px}.card-actions button{padding:5px 7px;font-size:.72rem}.delete{color:#fca5a5}.empty{color:var(--muted);font-size:.85rem;padding:12px}.modal-backdrop{position:fixed;inset:0;z-index:20;background:#000c;display:none;place-items:center;padding:16px}.modal-backdrop.open{display:grid}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 20px 60px #000a}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal h2{font:700 1.05rem Cinzel,serif;color:var(--gold)}.modal label{display:block;color:var(--muted);font-weight:700;font-size:.78rem;margin:12px 0 5px}.modal input,.modal select,.modal textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)}.modal textarea{height:130px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.player{display:none;position:fixed;z-index:10;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));padding:12px;background:#121722f5;border:1px solid var(--gold);border-radius:13px;box-shadow:0 15px 40px #000c}.player.show{display:block}.player-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}.player-top img{width:42px;height:42px;object-fit:cover;border-radius:7px}.player-info{min-width:0;flex:1}.player-info strong,.player-info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-info strong{color:var(--gold)}.player-info small{color:var(--muted);font-size:.72rem}.player audio{width:100%;height:34px}.player iframe{width:100%;height:150px;border:0;border-radius:8px}.square .card{width:88px;height:88px;padding:0;position:relative;overflow:hidden;flex-direction:column}.square .card img{width:100%;height:100%;border-radius:0}.square .card-info{position:absolute;bottom:0;padding:16px 4px 4px;text-align:center;background:linear-gradient(transparent,#070a10f2);width:100%}.square .card-title{font-size:.65rem;color:white}.square .card-meta{display:none}.square .card-actions{position:absolute;right:2px;top:2px}.square .card-actions button{padding:3px 5px}
    @media(max-width:650px){header{position:static;padding:13px}.brand h1{font-size:.84rem}.actions button{flex:1}.tier-label{width:78px;min-width:78px;font-size:.82rem}.row{grid-template-columns:1fr}.wrap{margin:14px auto;padding:0 10px}.hint{display:none}}
  </style>

<body>
<header>
  <div class="brand"><img src="https://i.scdn.co/image/ab676161000051742c039ae6de340c93ed6ff349" alt="Wuthering Waves" onerror="this.style.display='none'"><div><h1>WUTHERING WAVES • ARTIST SONGS TIER LIST</h1><div class="subtitle"><span id="count">0 bài hát</span> · <span id="status">Dữ liệu được lưu tự động trên thiết bị này</span></div></div></div>
  <nav class="actions" aria-label="Thao tác"><button class="primary" id="randomBtn">🎲 Random & xếp hạng</button><button class="green" id="syncBtn">↻ Quét nghệ sĩ WuWa</button><button class="primary" id="addBtn">＋ Thêm bài hát</button><button id="exportBtn">💾 Xuất JSON</button><button id="importBtn">📂 Nhập JSON</button><input id="fileInput" type="file" accept=".json,application/json" hidden><button id="modeBtn">Thẻ: Chi tiết</button><button id="tierAddBtn">＋ Thêm hàng</button><button id="pngBtn">📸 Xuất PNG</button><button id="resetBtn">↺ Đặt lại</button></nav>
</header>
<main class="wrap">
  <section class="hero" id="spotlight" aria-live="polite"><div class="spot"><img id="spotArt" alt="Ảnh bìa"><div><small id="spotCount">🎲 BÀI HÁT NGẪU NHIÊN</small><h2 id="spotTitle"></h2><p id="spotMeta"></p></div></div><div class="actions"><button id="spotPlay">▶ Nghe preview</button><button class="green" id="spotFull">🎵 Full Player</button><button id="spotNext">⏭ Bài khác</button><button id="spotClose">✕</button></div><div class="actions" id="quickTiers" style="width:100%"></div></section>
  <section class="board" id="tierBoard"><div class="board-head"><div class="board-title" id="boardTitle" contenteditable="true" role="textbox" aria-label="Tiêu đề tier list">WUTHERING WAVES — ARTIST DISCOGRAPHY TIER LIST</div><span class="hint">Kéo thả bài hát hoặc chọn bài rồi bấm vào hạng để xếp</span></div><div id="tiers"></div></section>
  <section class="pool"><div class="toolbar"><input class="field" id="search" type="search" placeholder="🔍 Tìm bài hát, album hoặc năm phát hành..."></div><div class="chips" id="eras"></div><div class="pool-items" id="pool" aria-label="Kho bài hát chưa xếp"></div></section>
</main>
<aside class="player" id="player"><div class="player-top"><img id="playerArt" alt=""><div class="player-info"><strong id="playerTitle"></strong><small id="playerSub"></small></div><button id="switchPlayer">Full Player</button><button id="closePlayer">✕</button></div><audio id="audio" controls></audio><div id="embed"></div></aside>
<div class="modal-backdrop" id="modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Thêm nhạc vào Tier List</h2><button id="modalClose">✕</button></div><div class="chips"><button class="chip active" data-tab="single">🎵 Thêm từng bài</button><button class="chip" data-tab="bulk">📋 Dán danh sách</button></div><div id="singlePanel"><label for="songTitle">Tên bài hát *</label><input id="songTitle" placeholder="Tên bài hát"><div class="row"><div><label for="songEra">Năm phát hành</label><select id="songEra"><option>2026</option><option>2025</option><option>2024</option><option>Khác</option></select></div><div><label for="songAlbum">Album / ghi chú</label><input id="songAlbum" placeholder="Wuthering Waves EP"></div></div><label for="songArt">Link ảnh bìa (tùy chọn)</label><input id="songArt" type="url" placeholder="https://..."><label for="songAudio">Link audio trực tiếp (tùy chọn)</label><input id="songAudio" type="url" placeholder="https://..."><div class="modal-actions"><button id="cancelAdd">Hủy</button><button class="primary" id="saveSong">＋ Thêm vào kho</button></div></div><div id="bulkPanel" hidden><label for="bulkText">Dán danh sách — mỗi dòng một tên bài</label><textarea id="bulkText" placeholder="Tên bài hát 1&#10;Tên bài hát 2"></textarea><label for="bulkEra">Năm phát hành</label><select id="bulkEra"><option>2026</option><option>2025</option><option>2024</option><option>Khác</option></select><div class="modal-actions"><button id="cancelBulk">Hủy</button><button class="primary" id="saveBulk">Thêm danh sách</button></div></div></section></div>
<script>
(() => {
  'use strict';
  const ART_DEFAULT='https://i.scdn.co/image/ab67616d00001e02bd8e1daf8a5400ef9f2ed047';
  const DEFAULT_TIERS=[{id:'t-splus',name:'S+ GOD TIER',color:'#E8C565'},{id:'t-s',name:'S TIER',color:'#FF7F7F'},{id:'t-a',name:'A TIER',color:'#FFBF7F'},{id:'t-b',name:'B TIER',color:'#FFFF7F'},{id:'t-c',name:'C TIER',color:'#BFFF7F'},{id:'t-d',name:'D TIER',color:'#7FBFFF'}];
  const fresh=()=>({title:'WUTHERING WAVES — ARTIST DISCOGRAPHY TIER LIST',tiers:DEFAULT_TIERS.map(x=>({...x})),items:[],placements:{},selectedEra:'ALL',squareMode:false});
  let state; try {state=JSON.parse(localStorage.getItem('wuwa_artist_only_v9')||localStorage.getItem('wuwa_artist_only_v8'))||fresh();}catch{state=fresh();}
  if(!Array.isArray(state.tiers)||!Array.isArray(state.items))state=fresh();
  let selectedId=null,draggedId=null,playing=null,spotlightItem=null,embedMode=false;
  const $=id=>document.getElementById(id);
  const save=()=>{state.title=$('boardTitle').innerText.trim()||'WUTHERING WAVES — ARTIST DISCOGRAPHY TIER LIST';try{localStorage.setItem('wuwa_artist_only_v9',JSON.stringify(state));$('status').textContent='Đã lưu tự động trên thiết bị này';}catch{$('status').textContent='Bộ nhớ đầy — hãy xuất JSON để sao lưu';}$('count').textContent=`${state.items.length} bài hát`;};
  const normalize=s=>(s||'').toLowerCase().replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^a-z0-9À-ɏ\s]/g,'').replace(/\s+/g,' ').trim();
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  function render(){ $('boardTitle').textContent=state.title;document.body.classList.toggle('square',!!state.squareMode);$('modeBtn').textContent=state.squareMode?'Thẻ: Vuông Cover':'Thẻ: Chi tiết';renderTiers();renderPool();renderEras();renderQuickTiers();save(); }
  function card(item){const c=el('article','card'+(selectedId===item.id?' selected':'')+(playing?.id===item.id?' playing':''));c.draggable=true;c.addEventListener('dragstart',()=>draggedId=item.id);c.addEventListener('click',()=>{selectedId=selectedId===item.id?null:item.id;render();});const img=el('img');img.src=item.art||ART_DEFAULT;img.alt='';img.loading='lazy';img.onerror=()=>img.src=ART_DEFAULT;const info=el('div','card-info');info.append(el('div','card-title',item.title),el('div','card-meta',`${item.meta||'Wuthering Waves'} · ${item.era||'Khác'}`));const actions=el('div','card-actions');const play=el('button','','▶');play.title='Nghe preview';play.addEventListener('click',e=>{e.stopPropagation();playTrack(item,false);});const full=el('button','','♫');full.title='Full Player';full.addEventListener('click',e=>{e.stopPropagation();playTrack(item,true);});const del=el('button','delete','✕');del.title='Xóa bài hát';del.addEventListener('click',e=>{e.stopPropagation();if(confirm(`Xóa “${item.title}” khỏi danh sách?`)){state.items=state.items.filter(x=>x.id!==item.id);delete state.placements[item.id];if(playing?.id===item.id)closePlayer();render();}});actions.append(play,full,del);c.append(img,info,actions);return c;}
  function renderTiers(){const root=$('tiers');root.replaceChildren();state.tiers.forEach(t=>{const row=el('section','tier');row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('over');});row.addEventListener('dragleave',()=>row.classList.remove('over'));row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('over');if(draggedId){state.placements[draggedId]=t.id;draggedId=null;selectedId=null;render();}});row.addEventListener('click',()=>{if(selectedId){state.placements[selectedId]=t.id;selectedId=null;render();}});const label=el('div','tier-label');label.style.background=t.color;const name=el('span','',t.name);name.contentEditable='true';name.addEventListener('click',e=>e.stopPropagation());name.addEventListener('blur',()=>{t.name=name.textContent.trim()||t.name;render();});const controls=el('div','tier-controls');const color=el('button','','🎨');color.title='Đổi màu';color.addEventListener('click',e=>{e.stopPropagation();const colors=['#E8C565','#FF7F7F','#FFBF7F','#FFFF7F','#BFFF7F','#7FBFFF','#C49BFF'];t.color=colors[(colors.indexOf(t.color)+1)%colors.length];render();});const remove=el('button','','✕');remove.title='Xóa hàng';remove.addEventListener('click',e=>{e.stopPropagation();if(confirm(`Xóa hàng ${t.name}?`)){state.tiers=state.tiers.filter(x=>x.id!==t.id);Object.keys(state.placements).forEach(id=>{if(state.placements[id]===t.id)delete state.placements[id];});render();}});controls.append(color,remove);label.append(name,controls);const items=el('div','items');state.items.filter(i=>state.placements[i.id]===t.id).forEach(i=>items.append(card(i)));row.append(label,items);root.append(row);});}
  function renderPool(){const root=$('pool'),q=$('search').value.trim().toLowerCase();root.replaceChildren();const arr=state.items.filter(i=>!state.placements[i.id]&&(state.selectedEra==='ALL'||i.era===state.selectedEra)&&(!q||`${i.title} ${i.meta} ${i.era}`.toLowerCase().includes(q)));if(!arr.length)root.append(el('div','empty',state.items.length?'Không có bài hát phù hợp. Hãy thêm bài hoặc đổi bộ lọc.':'Kho đang trống — bấm “Thêm bài hát” hoặc “Quét nghệ sĩ WuWa” để bắt đầu.'));arr.forEach(i=>root.append(card(i)));}
  function renderEras(){const root=$('eras');root.replaceChildren();const eras=['ALL',...new Set(['2026','2025','2024','Khác',...state.items.map(i=>i.era)].filter(x=>x&&x!=='ALL'))];eras.forEach(era=>{const n=era==='ALL'?state.items.length:state.items.filter(i=>i.era===era).length;if(era!=='ALL'&&!n)return;const b=el('button','chip'+(state.selectedEra===era?' active':''),`${era==='ALL'?'Tất cả năm':era==='Khác'?'Năm khác':'Năm '+era} (${n})`);b.addEventListener('click',()=>{state.selectedEra=era;render();});root.append(b);});}
  function renderQuickTiers(){const root=$('quickTiers');root.replaceChildren(el('span','','Xếp bài này vào:'));state.tiers.forEach(t=>{const b=el('button','',''+t.name);b.style.background=t.color;b.style.color='#0b0e14';b.style.fontWeight='800';b.addEventListener('click',()=>{if(!spotlightItem)return;state.placements[spotlightItem.id]=t.id;render();rollRandom();});root.append(b);});}
  function rollRandom(){const items=state.items.filter(i=>!state.placements[i.id]&&(state.selectedEra==='ALL'||i.era===state.selectedEra));if(!items.length){alert('Không còn bài hát chưa xếp trong bộ lọc hiện tại.');return;}spotlightItem=items[Math.floor(Math.random()*items.length)];$('spotlight').classList.add('show');$('spotArt').src=spotlightItem.art||ART_DEFAULT;$('spotTitle').textContent=spotlightItem.title;$('spotMeta').textContent=`${spotlightItem.meta||'Wuthering Waves'} · ${spotlightItem.era||'Khác'}`;$('spotCount').textContent=`🎲 CÒN ${items.length} BÀI CHƯA XẾP`;playTrack(spotlightItem,false);}
  function playTrack(item,full){playing=item;$('player').classList.add('show');$('playerArt').src=item.art||ART_DEFAULT;$('playerTitle').textContent=item.title;$('playerSub').textContent=item.meta||'Wuthering Waves';const audio=$('audio'),embed=$('embed');embed.replaceChildren();if(item.preview&&!full){embed.style.display='none';audio.style.display='block';audio.src=item.preview;audio.play().catch(()=>{});embedMode=false;$('switchPlayer').textContent='Full Player';}else{audio.pause();audio.style.display='none';embed.style.display='block';const frame=document.createElement('iframe');frame.title=`Nghe ${item.title} trên YouTube`;frame.allow='autoplay; encrypted-media';frame.allowFullscreen=true;frame.src=`https://www.youtube-nocookie.com/embed?listType=search&list=${encodeURIComponent('Wuthering Waves '+item.title)}&autoplay=1`;embed.append(frame);embedMode=true;$('switchPlayer').textContent=item.preview?'Audio preview':'YouTube';}render();}
  function closePlayer(){const audio=$('audio');audio.pause();audio.removeAttribute('src');$('embed').replaceChildren();$('player').classList.remove('show');playing=null;render();}
  function openModal(tab='single'){$('modal').classList.add('open');switchTab(tab);(tab==='single'?$ ('songTitle'):$('bulkText')).focus();}
  function switchTab(tab){const single=tab==='single';$('singlePanel').hidden=!single;$('bulkPanel').hidden=single;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
  function addSong(title,era,meta,art,preview){if(!title.trim())return false;if(state.items.some(i=>normalize(i.title)===normalize(title)))return false;state.items.unshift({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:title.trim(),era,meta:meta||'Wuthering Waves (Custom)',art:art||ART_DEFAULT,preview:preview||''});return true;}
  $('randomBtn').addEventListener('click',rollRandom);$('spotNext').addEventListener('click',rollRandom);$('spotClose').addEventListener('click',()=>{$('spotlight').classList.remove('show');spotlightItem=null;});$('spotPlay').addEventListener('click',()=>spotlightItem&&playTrack(spotlightItem,false));$('spotFull').addEventListener('click',()=>spotlightItem&&playTrack(spotlightItem,true));$('addBtn').addEventListener('click',()=>openModal());$('modalClose').addEventListener('click',()=>$('modal').classList.remove('open'));$('cancelAdd').addEventListener('click',()=>$('modal').classList.remove('open'));$('cancelBulk').addEventListener('click',()=>$('modal').classList.remove('open'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open');});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  $('saveSong').addEventListener('click',()=>{const ok=addSong($('songTitle').value,$('songEra').value,$('songAlbum').value.trim()||'Wuthering Waves (Custom)',$('songArt').value.trim(),$('songAudio').value.trim());if(!ok){alert($('songTitle').value.trim()?'Bài hát này đã có trong danh sách rồi.':'Vui lòng nhập tên bài hát.');return;}['songTitle','songAlbum','songArt','songAudio'].forEach(id=>$(id).value='');$('modal').classList.remove('open');render();});$('saveBulk').addEventListener('click',()=>{let added=0;$('bulkText').value.split(/\r?\n/).map(x=>x.trim()).filter(x=>x.length>1&&x.length<120&&!/instrumental|inst\.|boss theme/i.test(x)).forEach(title=>{if(addSong(title,$('bulkEra').value,'Wuthering Waves • Danh sách',ART_DEFAULT,''))added++;});$('bulkText').value='';$('modal').classList.remove('open');render();alert(`Đã thêm ${added} bài hát.`);});
  $('search').addEventListener('input',renderPool);$('boardTitle').addEventListener('input',save);$('modeBtn').addEventListener('click',()=>{state.squareMode=!state.squareMode;render();});$('tierAddBtn').addEventListener('click',()=>{const name=prompt('Tên hàng mới:','SS TIER');if(name?.trim()){state.tiers.unshift({id:'t-'+Date.now(),name:name.trim(),color:'#E8C565'});render();}});$('resetBtn').addEventListener('click',()=>{if(confirm('Đưa toàn bộ bài hát về kho chưa xếp?')){state.placements={};render();}});$('closePlayer').addEventListener('click',closePlayer);$('switchPlayer').addEventListener('click',()=>{if(!playing)return;if(embedMode&&playing.preview)playTrack(playing,false);else playTrack(playing,true);});
  $('pool').addEventListener('dragover',e=>e.preventDefault());$('pool').addEventListener('drop',e=>{e.preventDefault();if(draggedId){delete state.placements[draggedId];draggedId=null;render();}});
  $('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:'wuwa-tierlist-v4',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`wuwa-tier-list-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);});$('importBtn').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result),s=data.state||data;if(!Array.isArray(s.items)||!Array.isArray(s.tiers))throw Error();state={...fresh(),...s,placements:s.placements||{}};render();alert(`Đã khôi phục ${state.items.length} bài hát.`);}catch{alert('File JSON không đúng định dạng tier list.');}finally{e.target.value='';}};reader.readAsText(file);});
  $('pngBtn').addEventListener('click',()=>{if(!window.html2canvas){alert('Không tải được thư viện xuất ảnh. Hãy kiểm tra kết nối mạng.');return;}window.html2canvas($('tierBoard'),{backgroundColor:'#0e121b',scale:2,useCORS:true}).then(canvas=>{const a=document.createElement('a');a.download='wuthering-waves-tier-list.png';a.href=canvas.toDataURL('image/png');a.click();}).catch(()=>alert('Xuất ảnh không thành công.'));});
  $('syncBtn').addEventListener('click',syncArtist);
  async function syncArtist(){const status=$('status');status.textContent='Đang tìm bài hát từ nghệ sĩ Wuthering Waves…';const seen=new Set(state.items.map(i=>normalize(i.title)));let added=0;try{const r=await fetch('https://itunes.apple.com/search?term=Wuthering+Waves&attribute=artistTerm&entity=song&limit=200');if(!r.ok)throw Error('request failed');const data=await r.json();(data.results||[]).forEach(t=>{const artist=(t.artistName||'').trim().toLowerCase(),track=(t.trackName||'').toLowerCase(),album=(t.collectionName||'').toLowerCase();if(!(artist==='wuthering waves'||artist.startsWith('wuthering waves,')||artist.startsWith('wuthering waves &')||artist.startsWith('wuthering waves feat')))return;if(/instrumental|inst\.|off vocal|karaoke|boss|combat|battle/.test(track+' '+album))return;const key=normalize(t.trackName);if(!key||seen.has(key))return;seen.add(key);const year=(t.releaseDate||'2025').slice(0,4);state.items.push({id:'wuwa-art-'+t.trackId,title:t.trackName,meta:t.collectionName||'Wuthering Waves',era:['2024','2025','2026'].includes(year)?year:'Khác',art:t.artworkUrl100?t.artworkUrl100.replace('100x100','300x300'):ART_DEFAULT,preview:t.previewUrl||''});added++;});render();status.textContent=`Đã thêm ${added} bài hát mới từ nghệ sĩ Wuthering Waves.`;}catch{status.textContent='Không thể kết nối Apple Music. Bạn có thể thêm bài hát thủ công.';}}
  render();
})();
</script>
